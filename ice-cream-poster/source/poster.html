<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Cormorant';src:url(corm.woff2) format('woff2');font-weight:300 700;font-display:block}
  @font-face{font-family:'Cormorant';src:url(corm-it.woff2) format('woff2');font-style:italic;font-weight:300 700;font-display:block}
  @font-face{font-family:'Frank Ruhl';src:url(frank-he.woff2) format('woff2');font-weight:300 700;font-display:block}
  html,body{margin:0;padding:0;background:#fff}
  svg{display:block}
  .serif{font-family:'Cormorant',serif}
  .he{font-family:'Frank Ruhl',serif}
</style></head>
<body>
<div id="root"></div>
<script>
// Units: 1 = 1 mm. Panel chosen via ?panel=front|side
const P = new URLSearchParams(location.search).get('panel') || 'front';
const W = P === 'front' ? 1500 : 600, H = 700;

const C = {
  paper:'#F7F2E8', sand:'#EADCC4', sandD:'#D9C6A5',
  olive:'#5E6B1C', sage:'#B3AF62', sageL:'#D6D5A6',
  terra:'#C7805F', blush:'#EFC9B8', sun:'#E7A57E',
  sea:'#9DB9B1', seaD:'#7FA29A', sky1:'#F4D8C3', sky2:'#FAEEE2',
  cone:'#E6CFA4', pist:'#D8DBB0', vanilla:'#F6EBD3'
};
const LW = 2.6; // line weight for illustrations

function scoop(cx, cy, r, fill) {
  let d = `M ${cx - r} ${cy} C ${cx - r} ${cy - r * 1.3} ${cx + r} ${cy - r * 1.3} ${cx + r} ${cy} `;
  const n = 6, step = (2 * r) / n;
  for (let i = 0; i < n; i++) {
    const x0 = cx + r - i * step, x1 = x0 - step;
    const depth = [0.18, 0.38, 0.14, 0.3, 0.12, 0.22][i] * r;
    d += `C ${x0} ${cy + depth * 1.4} ${x1} ${cy + depth * 1.4} ${x1} ${cy} `;
  }
  return `<path d="${d}Z" fill="${fill}" stroke="${C.olive}" stroke-width="${LW}" stroke-linejoin="round"/>
    <path d="M ${cx - r * 0.55} ${cy - r * 0.5} C ${cx - r * 0.45} ${cy - r * 0.78} ${cx - r * 0.2} ${cy - r * 0.9} ${cx} ${cy - r * 0.92}"
      stroke="${C.olive}" stroke-width="${LW * 0.7}" fill="none" stroke-linecap="round" opacity=".55"/>`;
}

function cone(x, y, s, flavors) {
  const w = s * 0.56, top = y - s, id = 'c' + Math.round(x) + Math.round(y);
  let g = `<clipPath id="${id}"><path d="M ${x} ${y} L ${x - w / 2} ${top} L ${x + w / 2} ${top} Z"/></clipPath>`;
  g += `<path d="M ${x} ${y} L ${x - w / 2} ${top} L ${x + w / 2} ${top} Z" fill="${C.cone}"/>`;
  g += `<g clip-path="url(#${id})" stroke="${C.olive}" stroke-width="${LW * 0.6}" opacity=".7">`;
  for (let i = -5; i <= 5; i++) {
    const o = i * s * 0.14;
    g += `<line x1="${x - w + o}" y1="${top}" x2="${x + o + w * 0.25}" y2="${y}"/><line x1="${x + w - o}" y1="${top}" x2="${x - o - w * 0.25}" y2="${y}"/>`;
  }
  g += `</g><path d="M ${x} ${y} L ${x - w / 2} ${top} L ${x + w / 2} ${top} Z" fill="none" stroke="${C.olive}" stroke-width="${LW}" stroke-linejoin="round"/>`;
  let cy = top + s * 0.02, r = w * 0.6;
  flavors.forEach((f, i) => { g += scoop(x + (i % 2 ? r * 0.06 : 0), cy, r, f); cy -= r * 0.98; r *= 0.9; });
  return g;
}

function popsicle(x, y, h, fill, dip) {
  const w = h * 0.4, bodyH = h * 0.74, top = y - h;
  const body = `M ${x - w/2} ${top + bodyH} V ${top + w/2} A ${w/2} ${w/2} 0 0 1 ${x + w/2} ${top + w/2} V ${top + bodyH} Z`;
  const dipP = `M ${x - w/2} ${top + w*0.7} V ${top + w/2} A ${w/2} ${w/2} 0 0 1 ${x + w/2} ${top + w/2} V ${top + w*0.66}
      C ${x + w*0.4} ${top + w*0.95} ${x + w*0.26} ${top + w*0.95} ${x + w*0.2} ${top + w*0.7}
      C ${x + w*0.14} ${top + w*1.2} ${x - w*0.06} ${top + w*1.2} ${x - w*0.08} ${top + w*0.72}
      C ${x - w*0.16} ${top + w*0.92} ${x - w*0.34} ${top + w*0.96} ${x - w/2} ${top + w*0.7} Z`;
  return `<rect x="${x - w*0.11}" y="${top + bodyH - 6}" width="${w*0.22}" height="${h - bodyH + 6}" rx="${w*0.11}" fill="${C.cone}" stroke="${C.olive}" stroke-width="${LW}"/>
    <path d="${body}" fill="${fill}" stroke="${C.olive}" stroke-width="${LW}" stroke-linejoin="round"/>
    <path d="${dipP}" fill="${dip}" stroke="${C.olive}" stroke-width="${LW}" stroke-linejoin="round"/>
    <path d="M ${x - w*0.28} ${top + w*1.15} V ${top + bodyH - w*0.25}" stroke="${C.olive}" stroke-width="${LW*0.7}" stroke-linecap="round" opacity=".5"/>`;
}

// Sunset-over-the-sea arch window
function arch(cx, base, w, h, content) {
  const x0 = cx - w / 2, top = base - h, id = 'a' + Math.round(cx);
  const d = `M ${x0} ${base} V ${top + w / 2} A ${w / 2} ${w / 2} 0 0 1 ${x0 + w} ${top + w / 2} V ${base} Z`;
  const horizon = base - h * 0.34;
  let s = `<clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})">
    <rect x="${x0}" y="${top}" width="${w}" height="${h}" fill="url(#sky)"/>
    <circle cx="${cx}" cy="${horizon + 8}" r="${w * 0.3}" fill="${C.sun}" opacity=".85"/>
    <rect x="${x0}" y="${horizon}" width="${w}" height="${h}" fill="${C.sea}"/>`;
  for (let i = 0; i < 5; i++) {
    const yy = horizon + 14 + i * 16, amp = 3;
    s += `<path d="M ${x0} ${yy} ${Array.from({length: 8}, () => `q ${w/16} ${-amp} ${w/8} 0`).join(' ')}" stroke="${C.paper}" stroke-width="1.6" fill="none" opacity="${0.55 - i*0.07}"/>`;
  }
  s += `<path d="M ${x0} ${base - h*0.14} C ${x0 + w*0.3} ${base - h*0.2} ${x0 + w*0.7} ${base - h*0.11} ${x0 + w} ${base - h*0.17} V ${base} H ${x0} Z" fill="${C.sand}"/>
    </g><path d="${d}" fill="none" stroke="${C.olive}" stroke-width="2"/>
    <path d="M ${x0 - 12} ${base} V ${top + w / 2} A ${w / 2 + 12} ${w / 2 + 12} 0 0 1 ${x0 + w + 12} ${top + w / 2} V ${base}" fill="none" stroke="${C.sage}" stroke-width="1.4"/>`;
  return s + content;
}

function birds(x, y, s) {
  return `<g stroke="${C.olive}" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".7">
    <path d="M ${x} ${y} q ${s*0.5} ${-s*0.45} ${s} 0 q ${s*0.5} ${-s*0.45} ${s} 0"/>
    <path d="M ${x + s*2.6} ${y - s*0.9} q ${s*0.35} ${-s*0.3} ${s*0.7} 0 q ${s*0.35} ${-s*0.3} ${s*0.7} 0"/></g>`;
}

function waves(y, amp, len, color, sw, op) {
  let d = `M -20 ${y}`;
  for (let x = -20; x < W + 20; x += len) d += ` q ${len / 4} ${-amp} ${len / 2} 0 t ${len / 2} 0`;
  return `<path d="${d}" stroke="${color}" stroke-width="${sw}" fill="none" opacity="${op}"/>`;
}

function frame() {
  return `<rect x="22" y="22" width="${W - 44}" height="${H - 44}" fill="none" stroke="${C.olive}" stroke-width="1.6"/>
          <rect x="30" y="30" width="${W - 60}" height="${H - 60}" fill="none" stroke="${C.sage}" stroke-width="0.8"/>`;
}

function divider(cx, y, w) {
  return `<line x1="${cx - w/2}" y1="${y}" x2="${cx - 12}" y2="${y}" stroke="${C.sage}" stroke-width="1.4"/>
          <line x1="${cx + 12}" y1="${y}" x2="${cx + w/2}" y2="${y}" stroke="${C.sage}" stroke-width="1.4"/>
          <path d="M ${cx} ${y - 6} L ${cx + 6} ${y} L ${cx} ${y + 6} L ${cx - 6} ${y} Z" fill="${C.terra}"/>`;
}

function base(wy = H - 112) {
  return `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${C.sky2}"/><stop offset="1" stop-color="${C.sky1}"/></linearGradient>
      <radialGradient id="glow" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#FFFBF3"/><stop offset="1" stop-color="${C.paper}"/></radialGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#glow)"/>
    <path d="M 0 ${wy + 36} C ${W*0.25} ${wy + 14} ${W*0.55} ${wy + 58} ${W} ${wy + 26} V ${H} H 0 Z" fill="${C.sand}" opacity=".75"/>
    ${waves(wy, 7, 90, C.seaD, 1.6, .55)}
    ${waves(wy - 15, 5, 70, C.sea, 1.2, .45)}`;
}

function buildFront() {
  const cx = W / 2;
  let s = base();
  s += arch(240, 560, 290, 440, cone(240, 555, 185, [C.pist, C.blush]));
  s += arch(W - 240, 560, 290, 440, popsicle(W - 240, 555, 280, C.vanilla, C.blush));
  s += birds(170, 200, 16) + birds(W - 300, 190, 14);
  s += `<image href="logo_t.png" x="${cx - 200}" y="52" width="400" height="276"/>`;
  s += divider(cx, 350, 280);
  s += `<text x="${cx}" y="445" text-anchor="middle" class="serif" font-style="italic" font-weight="500" font-size="98" fill="${C.terra}">Something Sweet</text>`;
  s += `<text x="${cx}" y="495" text-anchor="middle" class="serif" font-weight="600" font-size="22" letter-spacing="7" fill="${C.olive}">ICE CREAM BY THE SEA · HELP YOURSELF</text>`;
  s += `<text x="${cx}" y="545" text-anchor="middle" class="he" font-size="34" fill="${C.olive}" direction="rtl" unicode-bidi="embed">משהו מתוק לפני שחוזרים לרקוד</text>`;
  return s + frame();
}

function buildSide() {
  const cx = W / 2;
  let s = base(H - 88);
  s += arch(cx, 420, 300, 360, cone(cx, 415, 165, [C.blush, C.pist]));
  s += birds(70, 120, 13);
  s += `<text x="${cx}" y="500" text-anchor="middle" class="serif" font-style="italic" font-weight="500" font-size="74" fill="${C.terra}">Stay Sweet</text>`;
  s += `<text x="${cx}" y="536" text-anchor="middle" class="serif" font-weight="600" font-size="20" letter-spacing="8" fill="${C.olive}">JENNIE &amp; GILAD</text>`;
  s += `<text x="${cx}" y="572" text-anchor="middle" class="he" font-size="28" fill="${C.olive}" direction="rtl" unicode-bidi="embed">תתפנקו</text>`;
  return s + frame();
}

document.getElementById('root').innerHTML =
  `<svg xmlns="http://www.w3.org/2000/svg" width="${W}mm" height="${H}mm" viewBox="0 0 ${W} ${H}">${P === 'front' ? buildFront() : buildSide()}</svg>`;
Promise.all([document.fonts.load('italic 500 90px Cormorant'), document.fonts.load('600 26px Cormorant'), document.fonts.load('36px "Frank Ruhl"', 'אבג')])
  .then(() => document.fonts.ready).then(() => document.body.dataset.ready = '1');
</script>
</body></html>
